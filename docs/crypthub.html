<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CryptHub</title>
<link rel="icon" href="favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0e0e0e;
  --surface: #141414;
  --fg:      #d4d4d4;
  --dim:     #666;
  --border:  #2a2a2a;
  --green:   #00e5a0;
  --red:     #ff4a6e;
  --warn:    #f5a623;
  --mono:    'JetBrains Mono', monospace;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg:      #f5f2eb;
    --surface: #edeae0;
    --fg:      #1a1a1a;
    --dim:     #888;
    --border:  #d0ccc2;
    --green:   #007a54;
    --red:     #c0392b;
    --warn:    #b07d00;
  }
}

html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--fg);
  background: none;
}

.hidden { display: none !important; }

/* ── centered screens ── */
.screen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  z-index: 10;
}

.box {
  width: 400px;
  border: 1px solid var(--border);
  padding: 32px;
  background: var(--surface);
}

.box-title {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 4px;
}
.box-title span { color: var(--green); }

.box-sub {
  font-size: 0.78rem;
  color: var(--dim);
  margin-bottom: 28px;
}

/* ── file options ── */
.opt {
  width: 100%;
  display: block;
  padding: 12px 14px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--fg);
  text-align: left;
  cursor: pointer;
  margin-bottom: 8px;
  transition: border-color .15s;
}
.opt:hover { border-color: var(--green); }
.opt strong { display: block; font-weight: 700; margin-bottom: 2px; }
.opt span { font-size: 0.75rem; color: var(--dim); }

.notice {
  margin-top: 20px;
  padding: 10px 14px;
  border-left: 2px solid var(--warn);
  font-size: 0.75rem;
  color: var(--dim);
  line-height: 1.6;
}

/* ── lock screen ── */
.vault-name {
  font-size: 0.75rem;
  color: var(--dim);
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.vault-name strong { color: var(--fg); }

.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--dim);
  margin-bottom: 6px;
}
.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--fg);
  outline: none;
  transition: border-color .15s;
}
.field input:focus,
.field select:focus,
.field textarea:focus { border-color: var(--green); }
.field textarea { resize: vertical; min-height: 72px; line-height: 1.6; }

.err {
  min-height: 18px;
  font-size: 0.75rem;
  color: var(--red);
  margin-bottom: 10px;
}

.btn-primary {
  width: 100%;
  padding: 10px;
  background: var(--green);
  color: #000;
  border: none;
  font-weight: 700;
  font-size: 0.75rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-primary:hover { opacity: .85; }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }

.btn-ghost {
  width: 100%;
  padding: 8px;
  background: none;
  border: none;
  font-size: 0.75rem;
  color: var(--dim);
  cursor: pointer;
  margin-top: 8px;
  transition: color .15s;
}
.btn-ghost:hover { color: var(--fg); }

/* ── app layout ── */
#app {
  display: grid;
  grid-template-columns: 200px 1fr;
  grid-template-rows: 40px 1fr;
  height: 100vh;
  width: 100vw;
}

/* ── titlebar ── */
#tb {
  grid-column: 1 / -1;
  grid-row: 1;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 12px;
}

.tb-brand { font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
.tb-brand span { color: var(--green); }

.tb-sep { color: var(--border); }

.tb-file {
  font-size: 0.75rem;
  color: var(--dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tb-status {
  font-size: 0.72rem;
  padding: 2px 8px;
  border: 1px solid var(--border);
  color: var(--dim);
  transition: all .2s;
}
.tb-status.saving { color: var(--warn); border-color: var(--warn); }
.tb-status.saved  { color: var(--green); border-color: var(--green); }

.tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.tb-btn {
  padding: 3px 10px;
  background: none;
  border: 1px solid var(--border);
  color: var(--dim);
  font-size: 0.72rem;
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.tb-btn:hover { border-color: var(--fg); color: var(--fg); }
.tb-btn.danger:hover { border-color: var(--red); color: var(--red); }

/* ── sidebar ── */
#sb {
  grid-column: 1;
  grid-row: 2;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sb-search {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-search input {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--fg);
  font-size: 0.78rem;
  outline: none;
}
.sb-search input:focus { border-color: var(--green); }
.sb-search input::placeholder { color: var(--dim); }

.sb-cats {
  flex: 1;
  overflow-y: auto;
  padding: 10px 0;
}
.sb-cats::-webkit-scrollbar { width: 3px; }
.sb-cats::-webkit-scrollbar-thumb { background: var(--border); }

.cat-label {
  font-size: 0.65rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--dim);
  padding: 0 12px;
  margin-bottom: 4px;
  display: block;
}

.cat {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 12px;
  cursor: pointer;
  font-size: 0.78rem;
  color: var(--dim);
  transition: color .12s;
  user-select: none;
}
.cat:hover { color: var(--fg); }
.cat.on { color: var(--green); }
.cat-count {
  font-size: 0.68rem;
  color: var(--dim);
}
.cat.on .cat-count { color: var(--green); }

.sb-foot {
  padding: 10px 12px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.btn-add {
  width: 100%;
  padding: 8px;
  background: none;
  border: 1px solid var(--border);
  color: var(--dim);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all .15s;
}
.btn-add:hover { border-color: var(--green); color: var(--green); }
.btn-add:disabled { opacity: .4; cursor: not-allowed; }

/* ── main panel ── */
#main {
  grid-column: 2;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

.main-hdr {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-shrink: 0;
}
.main-title { font-size: 0.82rem; font-weight: 700; }
.main-count { font-size: 0.72rem; color: var(--dim); }

/* ── entry table ── */
#list {
  flex: 1;
  overflow-y: auto;
}
#list::-webkit-scrollbar { width: 3px; }
#list::-webkit-scrollbar-thumb { background: var(--border); }

table.entries {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
}

table.entries thead tr {
  border-bottom: 1px solid var(--border);
}
table.entries thead th {
  padding: 8px 16px;
  text-align: left;
  font-size: 0.65rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 500;
  white-space: nowrap;
}

table.entries tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
table.entries tbody tr:hover { background: var(--surface); }
table.entries tbody tr:last-child { border-bottom: none; }

table.entries td {
  padding: 9px 16px;
  vertical-align: middle;
  color: var(--fg);
}

.td-label { font-weight: 700; }
.td-user  { color: var(--dim); font-size: 0.75rem; }
.td-cat   { color: var(--dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; }
.td-acts  { text-align: right; white-space: nowrap; }

.act {
  padding: 3px 10px;
  background: none;
  border: 1px solid var(--border);
  color: var(--dim);
  font-size: 0.7rem;
  cursor: pointer;
  margin-left: 4px;
  font-family: var(--mono);
  transition: all .12s;
}
.act:hover { border-color: var(--fg); color: var(--fg); }
.act.copied { border-color: var(--green); color: var(--green); }
.act.del:hover { border-color: var(--red); color: var(--red); }

/* empty state */
.empty {
  padding: 60px 20px;
  text-align: center;
  color: var(--dim);
  font-size: 0.82rem;
}

/* ── modal ── */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 50;
  display: flex; align-items: center; justify-content: center;
}
@media (prefers-color-scheme: light) {
  .modal-bg { background: rgba(0,0,0,.35); }
}

.modal-box {
  width: 440px;
  max-height: 90vh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 28px 28px 32px;
}
.modal-box::-webkit-scrollbar { width: 3px; }
.modal-box::-webkit-scrollbar-thumb { background: var(--border); }

.modal-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.modal-hdr h2 { font-size: 0.85rem; font-weight: 700; }

.modal-close {
  background: none;
  border: none;
  color: var(--dim);
  font-size: 1.1rem;
  cursor: pointer;
  padding: 0 4px;
  transition: color .12s;
  font-family: var(--mono);
}
.modal-close:hover { color: var(--fg); }

.modal-acts {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.modal-acts .btn-primary { flex: 1; }

.btn-secondary {
  padding: 10px 16px;
  background: none;
  border: 1px solid var(--border);
  color: var(--dim);
  font-size: 0.75rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .15s;
  font-family: var(--mono);
}
.btn-secondary:hover { border-color: var(--fg); color: var(--fg); }

/* pwd row */
.pwd-row { display: flex; gap: 8px; }
.pwd-row input { flex: 1; }
.btn-gen {
  padding: 9px 12px;
  background: none;
  border: 1px solid var(--border);
  color: var(--dim);
  font-size: 0.72rem;
  cursor: pointer;
  white-space: nowrap;
  transition: all .12s;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.btn-gen:hover { border-color: var(--green); color: var(--green); }

/* strength */
.str-bar { display: flex; gap: 3px; margin-top: 6px; }
.ss { flex: 1; height: 2px; background: var(--border); transition: background .25s; }
.ss.s1 { background: var(--red); }
.ss.s2 { background: var(--warn); }
.ss.s3 { background: #8bc34a; }
.ss.s4 { background: var(--green); }
.str-lbl { font-size: 0.68rem; color: var(--dim); margin-top: 4px; }

/* ── toast ── */
#toast {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 8px 20px;
  font-size: 0.78rem;
  z-index: 200;
  pointer-events: none;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  white-space: nowrap;
}
#toast.on { transform: translateX(-50%) translateY(0); }
#toast.success { border-color: var(--green); color: var(--green); }
#toast.error   { border-color: var(--red);   color: var(--red); }
#toast.warn    { border-color: var(--warn);   color: var(--warn); }
</style>
</head>
<body>

<!-- screen: pick file -->
<div class="screen" id="s-file">
  <div class="box">
    <div class="box-title">Crypt<span>Hub</span></div>
    <div class="box-sub">local-first password manager · AES-256-GCM</div>
    <button class="opt" id="btn-new">
      <strong>Create New Vault</strong>
      <span>Choose where to save your .crypthub file</span>
    </button>
    <button class="opt" id="btn-open">
      <strong>Open Existing Vault</strong>
      <span>Select your .crypthub file from disk</span>
    </button>
    <div class="notice">
      Requires Chrome 86+ or Edge 86+.
      Your vault is stored as an encrypted file on your device.
      Nothing is uploaded or transmitted.
    </div>
  </div>
</div>

<!-- screen: master password -->
<div class="screen hidden" id="s-lock">
  <div class="box">
    <div class="box-title">Crypt<span>Hub</span></div>
    <div class="box-sub" id="l-mode">Unlock vault</div>
    <div class="vault-name">File: <strong id="l-fname">vault.crypthub</strong></div>
    <div class="field">
      <label>Master Password</label>
      <input type="password" id="l-pwd" placeholder="enter master password" autocomplete="off"/>
    </div>
    <div class="field hidden" id="l-conf-wrap">
      <label>Confirm Password</label>
      <input type="password" id="l-conf" placeholder="confirm password" autocomplete="off"/>
    </div>
    <div class="err" id="l-err"></div>
    <button class="btn-primary" id="l-btn">Unlock</button>
    <button class="btn-ghost" id="btn-back">← choose a different file</button>
  </div>
</div>

<!-- app -->
<div id="app" class="hidden">

  <div id="tb">
    <div class="tb-brand">Crypt<span>Hub</span></div>
    <div class="tb-sep">·</div>
    <div class="tb-file" id="tb-fname">vault.crypthub</div>
    <div class="tb-status idle" id="save-status">saved</div>
    <div class="tb-right">
      <button class="tb-btn" id="btn-add-tb">+ new entry</button>
      <button class="tb-btn danger" id="btn-lock">lock</button>
    </div>
  </div>

  <div id="sb">
    <div class="sb-search">
      <input type="text" id="srch" placeholder="search..."/>
    </div>
    <div class="sb-cats">
      <span class="cat-label">Categories</span>
      <div id="cats"></div>
    </div>
    <div class="sb-foot">
      <button class="btn-add" id="btn-add">+ new entry</button>
    </div>
  </div>

  <div id="main">
    <div class="main-hdr">
      <span class="main-title" id="m-title">All</span>
      <span class="main-count" id="m-cnt"></span>
    </div>
    <div id="list"></div>
  </div>

</div>

<!-- modal -->
<div class="modal-bg hidden" id="modal">
  <div class="modal-box">
    <div class="modal-hdr">
      <h2 id="m-ttl">New Entry</h2>
      <button class="modal-close" id="m-cls">×</button>
    </div>
    <input type="hidden" id="eid"/>
    <div class="field">
      <label>Label *</label>
      <input type="text" id="f-lbl" placeholder="GitHub, Netflix…"/>
    </div>
    <div class="field">
      <label>Username / Email</label>
      <input type="text" id="f-usr" placeholder="user@example.com"/>
    </div>
    <div class="field">
      <label>Password *</label>
      <div class="pwd-row">
        <input type="text" id="f-pwd" placeholder="enter or generate…"/>
        <button class="btn-gen" id="btn-gen">generate</button>
      </div>
      <div class="str-bar">
        <div class="ss" id="ss1"></div>
        <div class="ss" id="ss2"></div>
        <div class="ss" id="ss3"></div>
        <div class="ss" id="ss4"></div>
      </div>
      <div class="str-lbl" id="s-lbl"></div>
    </div>
    <div class="field">
      <label>Category</label>
      <select id="f-cat">
        <option>General</option>
        <option>Social</option>
        <option>Work</option>
        <option>Finance</option>
        <option>Entertainment</option>
        <option>Dev / Tech</option>
        <option>Shopping</option>
        <option>Other</option>
      </select>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="f-nts" placeholder="optional…"></textarea>
    </div>
    <div class="modal-acts">
      <button class="btn-secondary" id="m-cancel">Cancel</button>
      <button class="btn-primary" id="m-save">Save Entry</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="js/main.js"></script>
</body>
</html>
